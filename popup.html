<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Azure Blob Downloader</title>
  <style>
    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --surface2:  #334155;
      --border:    #475569;
      --text:      #f1f5f9;
      --text-dim:  #94a3b8;
      --accent:    #6366f1;
      --accent-hi: #818cf8;
      --success:   #34d399;
      --warn:      #fb923c;
      --danger:    #f87171;
      --radius:    8px;
    }

    body {
      width: 357px;
      min-height: 480px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 20px;
      overflow-y: auto;
      max-height: 600px;
    }

    /* ─── Header ─── */
    .header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px;
    }
    .header-icon {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .header-icon svg { width: 20px; height: 20px; }
    .header h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
    .header p  { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

    /* ─── Section label ─── */
    .label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-dim);
      margin-bottom: 6px; margin-top: 14px;
    }
    .label:first-of-type { margin-top: 0; }

    /* ─── Inputs ─── */
    input[type="text"] {
      width: 100%; padding: 8px 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; outline: none; transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--text-dim); }

    /* ─── Drop-zone ─── */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      background: var(--surface);
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: #1e1b4b;
    }
    .dropzone .dz-icon { font-size: 22px; margin-bottom: 4px; }
    .dropzone .dz-text { font-size: 12px; color: var(--text-dim); }
    .dropzone .dz-text strong { color: var(--accent-hi); }
    .dropzone input { display: none; }

    /* chip shown after file is picked */
    .file-chip {
      display: none; align-items: center; gap: 8px;
      background: var(--surface2); border-radius: 6px;
      padding: 6px 10px; margin-top: 6px; font-size: 12px;
    }
    .file-chip.visible { display: flex; }
    .file-chip .chip-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-chip .chip-remove {
      cursor: pointer; color: var(--danger); font-size: 16px;
      line-height: 1; background: none; border: none;
    }

    /* ─── Buttons ─── */
    .btn {
      width: 100%; padding: 9px;
      border: none; border-radius: var(--radius);
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: filter .15s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.15); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; filter: none; transform: none; }
    .btn-secondary { background: var(--surface2); color: var(--text); margin-top: 6px; }
    .btn-secondary:hover { filter: brightness(1.1); }

    /* ─── Status badge ─── */
    .status-row { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--border); transition: background .3s;
    }
    .status-dot.connected  { background: var(--success); box-shadow: 0 0 6px var(--success)66; }
    .status-dot.connecting { background: var(--warn);    animation: pulse .9s infinite; }
    .status-dot.error       { background: var(--danger);  }
    @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
    .status-text { font-size: 12px; color: var(--text-dim); }

    /* ─── Log / results ─── */
    .log {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px;
      margin-top: 10px; max-height: 160px;
      overflow-y: auto; font-size: 11.5px;
      color: var(--text-dim); font-family: 'Consolas', 'Courier New', monospace;
    }
    .log:empty::after { content: "Logs will appear here…"; color: var(--border); font-style: italic; }
    .log .line { padding: 2px 0; border-bottom: 1px solid #1e293b55; }
    .log .line:last-child { border: none; }
    .log .ok  { color: var(--success); }
    .log .err { color: var(--danger); }
    .log .hi  { color: var(--accent-hi); }
    .log .dim { color: var(--text-dim); }

    /* ─── Summary bar ─── */
    .summary {
      display: none; gap: 12px; margin-top: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
    }
    .summary.visible { display: flex; }
    .summary-item { text-align: center; flex: 1; }
    .summary-item .s-val  { font-size: 18px; font-weight: 700; color: var(--accent-hi); }
    .summary-item .s-lbl  { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }

    /* scrollbar */
    ::-webkit-scrollbar           { width: 5px; }
    ::-webkit-scrollbar-track     { background: transparent; }
    ::-webkit-scrollbar-thumb     { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ─── Header ─── -->
<div class="header">
  <div class="header-icon">
    <img src="icons/MTA_NYC.png" alt="MTA" style="width:30px;height:30px;object-fit:contain;" />
  </div>
  <div>
    <h1>MTA C&D Tools Extension</h1>
    <p>Connect to Azure and download ASITE files</p>
  </div>
</div>

<!-- ─── Auth status ─── -->
<div class="status-row">
  <div class="status-dot" id="statusDot"></div>
  <span class="status-text" id="statusText">Not connected</span>
  <button class="btn btn-secondary" id="authBtn" style="width:auto;padding:4px 12px;margin-left:auto;font-size:11px;">Connect</button>
</div>

<!-- ─── Folder name ─── -->
<div class="label">Project Number:</div>
<input type="text" id="folderInput"/>

<!-- ─── CSV upload ─── -->
<div class="label">Upload CSV with file numbers:</div>
<div class="dropzone" id="dropzone">
  <div class="dz-icon"><img src="icons/download.png" alt="Browse" style="height:28px;width:auto;" /></div>
  <div class="dz-text">CLICK TO BROWSE</div>
  <input type="file" id="fileInput" accept=".csv" />
</div>
<div class="file-chip" id="fileChip">
  <span class="chip-name" id="chipName"></span>
  <button class="chip-remove" id="chipRemove">&times;</button>
</div>

<!-- ─── Actions ─── -->
<button class="btn btn-primary" id="downloadBtn" disabled style="margin-top:16px;"> Download Folder</button>

<!-- ─── Live log ─── -->
<div id="activitySection" style="display:none;">
  <div class="label">Activity</div>
  <div class="log" id="log"></div>
</div>

<!-- ─── Summary ─── -->
<div class="summary" id="summary">
  <div class="summary-item"><div class="s-val" id="sumSearched">0</div><div class="s-lbl">Searched</div></div>
  <div class="summary-item"><div class="s-val" id="sumFound">0</div><div class="s-lbl">Found</div></div>
  <div class="summary-item"><div class="s-val" id="sumDownloaded">0</div><div class="s-lbl">Downloaded</div></div>
</div>

<script src="popup.js"></script>
</body>
</html>
